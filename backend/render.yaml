databases:
  - name: stylo-ai-db
    databaseName: stylo_ai
    user: stylo
    plan: free

services:
  - type: web
    name: stylo-ai-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stylo-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
